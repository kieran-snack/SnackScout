{% extends "base.html" %}
{% block body %}
<h2>Teams matching “{{ q }}”</h2>
{% if results %}
<div class="table-wrap"><table>
  <tr><th>#</th><th class="l">Name</th><th class="l">Location</th></tr>
  {% for t in results %}
  <tr><td><a href="{{ url_for('team', number=t.number) }}">{{ t.number }}</a></td>
      <td class="l"><a href="{{ url_for('team', number=t.number) }}">{{ t.name }}</a></td>
      <td class="l muted">{{ t.location.city }}, {{ t.location.state }}, {{ t.location.country }}</td></tr>
  {% endfor %}
</table></div>
{% else %}<p class="muted">No teams found.</p>{% endif %}
{% endblock %}
