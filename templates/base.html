<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}SnackScout{% endblock %}</title>
  <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
  <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🍿</text></svg>">
</head>
<body>
<header class="top">
  <a class="logo" href="{{ url_for('index') }}">🍿 SnackScout</a>
  <form action="{{ url_for('search') }}">
    <input name="q" placeholder="Team number or name (or 16750, 3231 to compare)" value="{{ request.args.get('q','') }}">
    <button class="ghost">Scout</button>
  </form>
</header>
<main>{% block body %}{% endblock %}</main>
</body>
</html>
