{% extends "base.html" %}
{% block title %}Log in · SnackScout{% endblock %}
{% block body %}
<div class="panel auth reveal">
  <div class="auth-mark">🍿</div>
  <h1>Welcome back</h1>
  <p class="muted">Log in to Team Snack Time's scouting.</p>
  <form method="post" class="auth-form" data-loading="Logging in…">
    <label>Username<input name="username" autofocus autocomplete="username" required></label>
    <label>Password<input type="password" name="password" autocomplete="current-password" required></label>
    {% if error %}<div class="form-err">{{ error }}</div>{% endif %}
    <button class="wide">Log in</button>
  </form>
  <p class="small muted" style="margin-bottom:0">New to the team? <a href="{{ url_for('signup', next=request.args.get('next')) }}">Create an account</a> with the team code.</p>
</div>
{% endblock %}
