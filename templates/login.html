{% extends "base.html" %}
{% block title %}Log in · SnackScout{% endblock %}
{% block body %}
<div class="panel" style="max-width:380px;margin:60px auto;text-align:center">
  <div style="font-size:48px">🍿</div>
  <h1>SnackScout</h1>
  <p class="muted">Team Snack Time only. Enter the team password.</p>
  <form method="post" style="display:flex;flex-direction:column;gap:10px;margin-top:12px">
    <input type="password" name="password" autofocus autocomplete="current-password" placeholder="Team password" style="font-size:18px">
    <button style="font-size:18px">Log in</button>
  </form>
  {% if error %}<p class="L">{{ error }}</p>{% endif %}
</div>
{% endblock %}
